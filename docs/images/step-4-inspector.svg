<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker></defs><rect x="0" y="0" width="1200" height="640" rx="4" fill="#191919"/><text x="20" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#d2d2d2" text-anchor="start">Step 4: tell the clip what to change (Inspector)</text><rect x="20" y="60" width="520" height="560" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="60" width="520" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Inspector</text><text x="32" y="98" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#d2d2d2" text-anchor="start">Fade hello</text><text x="32" y="132" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Clip Timing</text><text x="44" y="160" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Start</text><rect x="164" y="145" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="172" y="160" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0 s</text><text x="44" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Duration</text><rect x="164" y="175" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="172" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0.6 s</text><text x="32" y="232" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">▾ Tl Clip</text><text x="44" y="264" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Target</text><rect x="164" y="249" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="264" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">hello</text><text x="508" y="264" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">▾</text><text x="44" y="296" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Property</text><rect x="164" y="281" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="296" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Opacity</text><text x="508" y="296" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">▾</text><text x="44" y="328" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Preset</text><rect x="164" y="313" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="328" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Pick a ready-made animation…</text><text x="508" y="328" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">▾</text><rect x="44" y="342" width="480" height="54" rx="3" fill="#232323" stroke="#4a4a4a" stroke-width="1.5"/><text x="54" y="362" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">0 is invisible, 1 is as designed. The clip goes</text><text x="54" y="382" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">From → To, shaped by Ease. Hold keeps To after.</text><text x="44" y="424" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">From</text><rect x="164" y="409" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="172" y="424" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0</text><text x="44" y="456" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">To</text><rect x="164" y="441" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="172" y="456" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">1</text><text x="44" y="488" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Ease</text><rect x="164" y="473" width="360" height="40" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1.5"/><path d="M170,508 C230,477 300,478 518,478" stroke="#4fd1a5" stroke-width="2" fill="none"/><text x="44" y="544" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Hold</text><rect x="164" y="530" width="20" height="20" rx="3" fill="#2c5d87" stroke="#4a4a4a" stroke-width="1.5"/><text x="168" y="545" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">✓</text><circle cx="560" cy="264" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="269" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text><rect x="590" y="230" width="340" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Target: which element. The list shows</text><text x="600" y="271" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">every Name from UI Builder. The clip</text><text x="600" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">renames itself: Fade hello, Hide title.</text><circle cx="560" cy="296" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="301" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text><rect x="590" y="300" width="340" height="29" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Property: what changes (Animate only).</text><circle cx="560" cy="328" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="333" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text><rect x="590" y="332" width="340" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="354" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Preset: pick one and it fills in Property,</text><text x="600" y="373" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">From, To, Ease, Hold and the clip's length.</text><text x="600" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">No typing. Change anything after.</text><circle cx="560" cy="440" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="445" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">4</text><rect x="590" y="410" width="340" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="432" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">From and To: the numbers at the</text><text x="600" y="451" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">clip's start and end. Drag the word</text><text x="600" y="470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">From or To left and right to change it.</text><circle cx="560" cy="493" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="498" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">5</text><rect x="590" y="478" width="340" height="29" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="500" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Ease: the shape of the change.</text><circle cx="560" cy="540" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="545" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">6</text><rect x="590" y="528" width="340" height="29" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="550" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Hold: keep To after the clip ends.</text><text x="950" y="100" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#d2d2d2" text-anchor="start">Presets</text><text x="950" y="130" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#9fd3ff" text-anchor="start">Appear ▸</text><text x="966" y="152" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Fade in</text><text x="966" y="172" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Slide in from the left / right</text><text x="966" y="192" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Slide in from the top / bottom</text><text x="966" y="212" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Pop in</text><text x="966" y="232" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Type out the text</text><text x="950" y="260" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#9fd3ff" text-anchor="start">Disappear ▸</text><text x="966" y="282" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Fade out</text><text x="966" y="302" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Slide out to the left / right</text><text x="966" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Shrink away</text><text x="950" y="350" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#9fd3ff" text-anchor="start">Attention ▸</text><text x="966" y="372" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Pop (grow and back)</text><text x="966" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Shake</text><text x="966" y="412" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Blink</text><text x="966" y="432" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">Spin once</text><text x="950" y="460" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#9fd3ff" text-anchor="start">Fill ▸</text><text x="966" y="482" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">a progress bar (0 to 100)</text><text x="966" y="502" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#d2d2d2" text-anchor="start">a radial fill (0 to 1)</text><text x="1184" y="628" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">Diagram of the Unity Editor, not a screenshot</text></svg>
