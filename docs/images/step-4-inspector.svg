<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker></defs><rect x="0" y="0" width="1200" height="600" rx="4" fill="#191919"/><text x="20" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#d2d2d2" text-anchor="start">Step 4: tell the clip what to change (Inspector)</text><rect x="20" y="60" width="520" height="520" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="60" width="520" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Inspector</text><text x="32" y="98" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#d2d2d2" text-anchor="start">Fade hello</text><text x="32" y="132" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Clip Timing</text><text x="44" y="160" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Start</text><rect x="164" y="145" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="172" y="160" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0 s</text><text x="44" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Duration</text><rect x="164" y="175" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="172" y="190" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0.6 s</text><text x="32" y="232" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">▾ Tl Clip</text><text x="44" y="264" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Target</text><rect x="164" y="249" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="264" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">hello</text><text x="508" y="264" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">▾</text><text x="44" y="296" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Property</text><rect x="164" y="281" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="296" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Opacity</text><text x="508" y="296" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">▾</text><rect x="44" y="310" width="480" height="54" rx="3" fill="#232323" stroke="#4a4a4a" stroke-width="1.5"/><text x="54" y="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">0 is invisible, 1 is as designed. The clip goes</text><text x="54" y="350" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start">From → To, shaped by Ease. Hold keeps To after.</text><text x="44" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">From</text><rect x="164" y="377" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0</text><text x="44" y="424" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">To</text><rect x="164" y="409" width="360" height="22" rx="3" fill="#1f1f1f" stroke="#ff9f1a" stroke-width="2"/><text x="172" y="424" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">1</text><text x="44" y="456" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Ease</text><rect x="164" y="441" width="360" height="40" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1.5"/><path d="M170,476 C230,445 300,446 518,446" stroke="#4fd1a5" stroke-width="2" fill="none"/><text x="44" y="512" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Hold</text><rect x="164" y="498" width="20" height="20" rx="3" fill="#2c5d87" stroke="#4a4a4a" stroke-width="1.5"/><text x="168" y="513" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start">✓</text><circle cx="560" cy="264" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="269" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text><rect x="590" y="230" width="340" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Target: which element. The list shows</text><text x="600" y="271" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">every Name from UI Builder. The clip</text><text x="600" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">renames itself: Fade hello, Hide title.</text><circle cx="560" cy="296" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="301" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text><rect x="590" y="300" width="340" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="322" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Property: Opacity, Move X, Move Y,</text><text x="600" y="341" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Scale, Rotate, Width %, Height %,</text><text x="600" y="360" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Reveal (typing) or Value (bars).</text><circle cx="560" cy="408" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="413" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text><rect x="590" y="376" width="340" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="398" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">From and To: the numbers at the</text><text x="600" y="417" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">clip's start and end. Equal numbers</text><text x="600" y="436" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">mean nothing moves (it warns you).</text><circle cx="560" cy="461" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="466" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">4</text><rect x="590" y="446" width="340" height="29" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="468" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Ease: the shape of the change.</text><circle cx="560" cy="508" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="513" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">5</text><rect x="590" y="496" width="340" height="29" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="600" y="518" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Hold: keep To after the clip ends.</text><text x="960" y="120" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#d2d2d2" text-anchor="start">Examples</text><text x="960" y="150" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Fade in</text><text x="1180" y="150" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fd3ff" text-anchor="end">Opacity 0 → 1</text><text x="960" y="184" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Slide in from left</text><text x="1180" y="184" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fd3ff" text-anchor="end">Move X -300 → 0</text><text x="960" y="218" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Pop</text><text x="1180" y="218" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fd3ff" text-anchor="end">Scale 0.6 → 1</text><text x="960" y="252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Spin</text><text x="1180" y="252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fd3ff" text-anchor="end">Rotate 0 → 360</text><text x="960" y="286" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Type out text</text><text x="1180" y="286" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fd3ff" text-anchor="end">Reveal 0 → 1</text><text x="960" y="320" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Fill a bar</text><text x="1180" y="320" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#9fd3ff" text-anchor="end">Value 0 → 1</text><text x="1184" y="588" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">Diagram of the Unity Editor, not a screenshot</text></svg>
