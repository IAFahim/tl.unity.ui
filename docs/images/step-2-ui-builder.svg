Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Size</text><rect x="982" y="245" width="186" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="990" y="260" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">40</text><text x="902" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Color</text><rect x="982" y="275" width="186" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="990" y="290" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">■ white</text><text x="902" y="334" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Background</text><text x="902" y="364" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Color</text><rect x="982" y="349" width="186" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="990" y="364" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">■ none</text><text x="902" y="408" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Position</text><text x="902" y="438" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Margin</text><rect x="982" y="423" width="186" height="22" rx="3" fill="#1f1f1f" stroke="#4a4a4a" stroke-width="1"/><text x="990" y="438" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">0 0 24 0</text><circle cx="240" cy="224" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="240" y="229" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text><rect x="120" y="590" width="280" height="48" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="130" y="612" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Drag a Label from the Library</text><text x="130" y="631" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">onto the screen (or the Hierarchy).</text><line x1="250" y1="226" x2="460" y2="200" stroke="#ff9f1a" stroke-width="2.5" marker-end="url(#head)"/><circle cx="1160" cy="156" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="1160" y="161" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text><rect x="880" y="470" width="290" height="48" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="890" y="492" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Type a Name. That name is what</text><text x="890" y="511" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">clips pick as their Target.</text><circle cx="1160" cy="290" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="1160" y="295" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text><rect x="880" y="540" width="290" height="48" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="890" y="562" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Style it here: text, colour,</text><text x="890" y="581" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">size, spacing. Or in your .uss.</text><circle cx="860" cy="104" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="860" y="109" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">4</text><rect x="560" y="520" width="260" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="570" y="542" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Ctrl+S saves Screen.uxml.</text><text x="570" y="561" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">The name now shows in every</text><text x="570" y="580" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">clip's Target list.</text><text x="1184" y="628" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">Diagram of the Unity Editor, not a screenshot</text></svg>
