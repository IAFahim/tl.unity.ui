<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker></defs><rect x="0" y="0" width="1200" height="640" rx="4" fill="#191919"/><text x="20" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#d2d2d2" text-anchor="start">Step 2: design the screen in UI Builder (UI Toolkit)</text><text x="20" y="64" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="400" fill="#8f8f8f" text-anchor="start">In the Project window, double-click Screen.uxml. UI Builder opens:</text><rect x="20" y="80" width="250" height="260" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="80" width="250" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="98" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Library</text><text x="32" y="124" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Containers</text><text x="32" y="149" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  VisualElement</text><text x="32" y="174" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  ScrollView</text><text x="32" y="199" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Controls</text><rect x="24" y="209" width="242" height="22" rx="2" fill="#2c5d87"/><text x="32" y="224" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Label</text><text x="32" y="249" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Button</text><text x="32" y="274" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Slider</text><text x="32" y="299" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  ProgressBar</text><rect x="20" y="350" width="250" height="270" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="350" width="250" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="368" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Hierarchy</text><text x="32" y="394" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Screen.uxml</text><text x="44" y="418" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">#screen</text><text x="56" y="442" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">#hello</text><rect x="24" y="451" width="242" height="22" rx="2" fill="#2c5d87"/><text x="56" y="466" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">#title</text><rect x="280" y="80" width="600" height="540" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="280" y="80" width="600" height="26" rx="4" fill="#3c3c3c"/><text x="290" y="98" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Viewport</text><rect x="300" y="120" width="560" height="480" rx="2" fill="#10131a"/><rect x="500" y="260" width="160" height="70" rx="12" fill="#2858c8"/><text x="580" 