<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="4" fill="#191919"/><text x="20" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#d2d2d2" text-anchor="start">Step 1: make a screen (one click)</text><rect x="20" y="60" width="330" height="470" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="60" width="330" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Hierarchy</text><text x="32" y="100" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Main Camera</text><text x="32" y="124" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Directional Light</text><rect x="150" y="150" width="220" height="210" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.5"/><text x="162" y="175" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Copy</text><text x="162" y="205" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Paste</text><text x="162" y="235" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Create Empty</text><text x="162" y="265" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">UI Toolkit  ▸</text><rect x="154" y="280" width="212" height="22" rx="2" fill="#2c5d87"/><text x="162" y="295" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Tl UI  ▸</text><text x="162" y="325" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Camera</text><rect x="372" y="285" width="150" height="34" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.5"/><rect x="376" y="293" width="142" height="22" rx="2" fill="#2c5d87"/><text x="384" y="308" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Screen</text><circle cx="60" cy="160" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="60" y="165" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text><rect x="30" y="380" width="250" height="48" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="40" y="402" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Save your scene, then right-click</text><text x="40" y="421" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">empty space in the Hierarchy.</text><circle cx="388" cy="268" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="388" y="273" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text><rect x="400" y="220" width="170" height="29" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="410" y="242" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Pick Tl UI ▸ Screen.</text><line x1="530" y1="302" x2="640" y2="302" stroke="#ff9f1a" stroke-width="2.5" marker-end="url(#head)"/><rect x="650" y="60" width="260" height="200" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="650" y="60" width="260" height="26" rx="4" fill="#3c3c3c"/><text x="660" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Hierarchy, after</text><text x="662" y="100" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Main Camera</text><text x="662" y="124" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Directional Light</text><rect x="654" y="133" width="252" height="22" rx="2" fill="#2c5d87"/><text x="662" y="148" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Screen</text><text x="662" y="172" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">☑ Screen Timelines</text><text x="678" y="196" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Screen Timelines</text><rect x="920" y="60" width="260" height="200" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="920" y="60" width="260" height="26" rx="4" fill="#3c3c3c"/><text x="930" y="78" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Project, after</text><text x="932" y="100" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Tl UI</text><text x="932" y="124" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Screen.uxml</text><text x="932" y="148" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Screen Timeline.playable</text><text x="932" y="172" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Screen Timelines (scene)</text><text x="932" y="196" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">  Screen Panel Settings</text><rect x="650" y="280" width="530" height="250" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="650" y="280" width="530" height="26" rx="4" fill="#3c3c3c"/><text x="660" y="298" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Game, press Play</text><rect x="670" y="316" width="490" height="196" rx="2" fill="#10131a"/><rect x="845" y="384" width="140" height="60" rx="12" fill="#2858c8"/><text x="915" y="424" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Hello</text><circle cx="1150" cy="300" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="1150" y="305" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text><rect x="860" y="456" width="290" height="67" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="870" y="478" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Press Play: Hello fades in and</text><text x="870" y="497" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">slides up. That motion is two</text><text x="870" y="516" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">clips on the Screen Timeline.</text><rect x="20" y="560" width="620" height="100" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="560" width="620" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="578" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Inspector   Screen (selected for you)</text><rect x="32.0" y="600" width="192.66666666666666" height="24" rx="3" fill="#3c3c3c" stroke="#4a4a4a" stroke-width="1"/><text x="128.33333333333331" y="617" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="middle">Layout</text><rect x="228.66666666666666" y="600" width="192.66666666666666" height="24" rx="3" fill="#3c3c3c" stroke="#4a4a4a" stroke-width="1"/><text x="325.0" y="617" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="middle">Timeline</text><rect x="425.3333333333333" y="600" width="192.66666666666666" height="24" rx="3" fill="#3c3c3c" stroke="#4a4a4a" stroke-width="1"/><text x="521.6666666666666" y="617" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="middle">Other timelines ▾</text><text x="32" y="646" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f8f8f" text-anchor="start">Tl UI Panel   Commands, Lists, Signals…</text><circle cx="660" cy="612" r="15" fill="#ff9f1a" stroke="#1a1a1a" stroke-width="2"/><text x="660" y="617" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">4</text><rect x="690" y="590" width="420" height="86" rx="6" fill="#2b2416" stroke="#ff9f1a" stroke-width="1.5"/><text x="700" y="612" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">The Screen's Inspector starts with an Edit bar.</text><text x="700" y="631" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Layout opens UI Builder, Timeline opens the</text><text x="700" y="650" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">timeline, Other timelines opens or makes more.</text><text x="700" y="669" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">The Timeline window is already open for you.</text><text x="1184" y="708" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">Diagram of the Unity Editor, not a screenshot</text></svg>
