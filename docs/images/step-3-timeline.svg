chor="start">shows the screen at that moment.</text><text x="1184" y="628" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">Diagram of the Unity Editor, not a screenshot</text></svg>
