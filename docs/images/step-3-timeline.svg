, Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">expand it, click the object inside.</text><text x="350" y="130" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffe2b8" text-anchor="start">Window ▸ Sequencing ▸ Timeline shows it.</text><rect x="20" y="290" width="1160" height="330" rx="4" fill="#282828" stroke="#4a4a4a" stroke-width="1.5"/><rect x="20" y="290" width="1160" height="26" rx="4" fill="#3c3c3c"/><text x="30" y="308" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#d2d2d2" text-anchor="start">Timeline</text><rect x="30" y="324" width="30" height="22" rx="3" fill="#3c3c3c" stroke="#4a4a4a" stroke-width="1.5"/><text x="45.0" y="340.0" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="middle">+</text><rect x="30" y="350" width="180" height="150" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.5"/><text x="42" y="374" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Track Group</text><text x="42" y="402" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Tl ▸</text><rect x="34" y="415" width="172" height="22" rx="2" fill="#2c5d87"/><text x="42" y="430" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">UI  ▸</text><rect x="212" y="410" width="150" height="190" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.5"/><text x="224" y="432" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-anchor="start">Show</text><text x="224" y="457" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#d2d2d2" text-ancho